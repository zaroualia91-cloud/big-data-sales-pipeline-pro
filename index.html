<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NABIL | Big Data Sales Pipeline PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:white;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
#login{max-width:400px;width:90%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:40px;text-align:center}

button{width:100%;padding:14px;border-radius:10px;border:none;background:linear-gradient(90deg,#6c5cff,#a855f7);color:white;font-weight:bold;cursor:pointer}
#error{color:#ff5555;font-size:13px;margin-top:12px;display:none}
#dashboard{display:none;max-width:1100px;width:95%;padding:20px}
.header{text-align:center;margin-bottom:30px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:30px}
.card{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:25px}
.card .val{font-size:28px;font-weight:bold;color:#6c5cff}
.badge{display:inline-block;background:#00ff8820;color:#00ff88;border:1px solid #00ff8850;padding:4px 10px;border-radius:20px;font-size:11px;margin:5px}
</style>
</head>
<body>
<div id="login">
<h1>BIG DATA SALES PIPELINE PRO</h1>
<p class="sub">Private Access • NABIL ZAROUALI</p>
<input type="password" id="pwd" placeholder="Enter Password NABIL2026">
<button onclick="check()">UNLOCK PROJECT</button>
<p id="error">Mot de passe incorrect!</p>
</div>
<div id="dashboard">
<div class="header">
<h2>NABIL ZAROUALI | DATA ENGINEER</h2>
<p style="color:#888;margin-top:10px">Big Data Sales Pipeline PRO</p>
<div style="margin-top:15px">
<span class="badge">LIVE</span>
<span class="badge">PROTECTED: NABIL2026</span>
<span class="badge">OPTIMIZED</span>
</div>
</div>
<div class="kpis">
<div class="card"><h3>TOTAL REVENUE</h3><div class="val">138,911,637 MAD</div></div>

<div class="card"><h3>ENGINE</h3><div class="val">PySpark 3.5</div></div>
</div>
</div>
<script>
function check(){
  var p=document.getElementById('pwd').value;
  if(p==='NABIL2026'){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';localStorage.setItem('nabil_access','ok');}
  else{document.getElementById('error').style.display='block';}
}
if(localStorage.getItem('nabil_access')==='ok'){document.getElementById('login').style.display='none';document.getElementById('dashboard').style.display='block';}
</script>
</body>
</html>
